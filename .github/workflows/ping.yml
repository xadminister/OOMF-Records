name: Ping Minecraft server

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to commit the log back to the repo

# Never let two runs overlap and fight over the log file
concurrency:
  group: mc-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ping server
        env:
          # Set these under Settings > Secrets and variables > Actions > Variables
          MC_HOST: ${{ vars.MC_HOST }}
          MC_EDITION: ${{ vars.MC_EDITION || 'java' }}
        run: python ping.py

      - name: Commit log
        run: |
          git config user.name "mc-ping-bot"
          git config user.email "mc-ping-bot@users.noreply.github.com"
          git add logs/
          git diff --staged --quiet || git commit -m "Log $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push